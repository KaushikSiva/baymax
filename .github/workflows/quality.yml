name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install portable test dependencies
        run: >-
          python -m pip install pytest numpy pydantic Pillow PyYAML websockets
      - name: Compile Python
        run: python -m compileall -q baymax_nurse tests scripts/prepare_hospital_assets.py
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run portable tests
        run: python -m pytest -q
